apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: ghcr.io/sebastianxjavier/hello-world:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "500Mi"
      imagePullSecrets:
      - name: github-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
spec:
  selector:
    app: hello-world
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-node-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - helloworld.sewa.cl
  rules:
  - host: helloworld.sewa.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-node-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-world-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-world
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15 # Espera 15s para estabilizar antes de subir
      selectPolicy: Max
      policies:
      - type: Pods
        value: 2 # Máximo 2 pods nuevos por periodo
        periodSeconds: 15
      - type: Percent
        value: 50 # O hasta 50% de los pods actuales
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30 # Espera 30s antes de bajar pods
      selectPolicy: Max
      policies:
      - type: Pods
        value: 2 # Máximo 2 pods menos por periodo
        periodSeconds: 15
      - type: Percent
        value: 25 # O hasta 25% de los pods actuales
        periodSeconds: 15